<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1A1A2E">
  <title>ライフステージと健康</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="健康クイズ">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    }

    .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
    .screen.active { display: flex; }

    /* ═══ HOME ═══ */
    #screen-home {
      background: #1A1A2E;
      align-items: center; justify-content: center;
      gap: 20px; padding: 40px 28px;
    }
    .home-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      color: rgba(255,255,255,0.45); text-transform: uppercase;
    }
    .home-title {
      font-size: 26px; font-weight: 800; color: #fff;
      text-align: center; line-height: 1.45;
    }
    .home-chapter {
      font-size: 13px; color: rgba(255,255,255,0.5);
    }
    .home-divider {
      width: 40px; height: 2px;
      background: rgba(255,255,255,0.15); border-radius: 1px;
    }
    .home-count-wrap {
      display: flex; gap: 20px;
    }
    .home-stat {
      text-align: center;
    }
    .home-stat-num {
      font-size: 28px; font-weight: 800; color: #fff;
    }
    .home-stat-lbl {
      font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px;
    }
    .btn-start {
      margin-top: 8px;
      width: 100%; max-width: 280px;
      padding: 18px;
      background: #E74C3C; color: #fff;
      border: none; border-radius: 18px;
      font-size: 17px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: transform .1s, background .1s;
    }
    .btn-start:active { transform: scale(0.97); background: #C0392B; }

    /* ═══ QUIZ ═══ */
    #screen-quiz { background: #F2F2F7; }

    .quiz-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: env(safe-area-inset-top, 48px) 16px 10px;
      flex-shrink: 0;
    }
    .topbar-progress { font-size: 13px; font-weight: 600; color: #555; }
    .topbar-close {
      background: #E5E5EA; border: none; border-radius: 50%;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; color: #555;
    }

    .progress-track {
      height: 3px; background: #E0E0E0; flex-shrink: 0;
      margin: 0 16px;
    }
    .progress-fill {
      height: 100%; background: #E74C3C; border-radius: 2px;
      transition: width .3s cubic-bezier(.4,0,.2,1);
    }

    .score-row {
      display: flex; gap: 16px; padding: 10px 20px; flex-shrink: 0;
    }
    .score-chip {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700;
    }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; }
    .chip-ok .chip-dot  { background: #2E86C1; }
    .chip-ng .chip-dot  { background: #E74C3C; }
    .chip-ok { color: #2E86C1; }
    .chip-ng { color: #E74C3C; }

    .card-area {
      flex: 1; min-height: 0;
      padding: 8px 16px 14px; display: flex; flex-direction: column;
    }
    .quiz-card {
      background: #fff; border-radius: 22px;
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 12px rgba(0,0,0,0.07);
    }

    .card-q {
      flex: 1; padding: 28px 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; line-height: 1.9; color: #111; text-align: center;
    }
    .card-sep { height: 1px; background: #F0F0F0; flex-shrink: 0; }

    .card-a-wrap {
      position: relative; flex-shrink: 0; min-height: 110px;
      display: flex; align-items: center; justify-content: center;
    }
    .card-a {
      padding: 22px 28px;
      font-size: 22px; font-weight: 800; color: #111;
      text-align: center; line-height: 1.5; width: 100%;
    }
    .answer-cover {
      position: absolute; inset: 0;
      border-radius: 0 0 22px 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .22s ease;
    }
    .answer-cover.state-hidden  { background: rgba(231,76,60,1); }
    .answer-cover.state-wrong   { background: rgba(231,76,60,0.22); }
    .answer-cover.state-correct { background: rgba(46,134,193,0.22); }
    .cover-label {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85);
      transition: opacity .2s;
      pointer-events: none;
    }
    .answer-cover.state-wrong .cover-label,
    .answer-cover.state-correct .cover-label {
      color: transparent;
    }

    .quiz-footer {
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 20px));
      flex-shrink: 0;
    }
    .btn-next {
      width: 100%; padding: 15px;
      background: #1A1A2E; color: #fff;
      border: none; border-radius: 16px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: background .1s;
    }
    .btn-next:active { background: #333; }

    /* ═══ RESULT ═══ */
    #screen-result {
      background: #1A1A2E;
      align-items: center; justify-content: center;
      padding: 40px 28px; gap: 22px;
    }
    .result-heading { font-size: 22px; font-weight: 800; color: #fff; }
    .result-panel {
      background: rgba(255,255,255,0.08);
      border-radius: 22px; padding: 28px 36px;
      text-align: center; width: 100%; max-width: 320px;
    }
    .result-pct {
      font-size: 62px; font-weight: 800; color: #fff; line-height: 1;
    }
    .result-pct-lbl {
      font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 6px;
    }
    .result-nums {
      display: flex; justify-content: center; gap: 28px; margin-top: 20px;
    }
    .result-num-item { text-align: center; }
    .result-num-val { font-size: 28px; font-weight: 800; }
    .result-num-lbl { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 3px; }
    .col-ok { color: #5DADE2; }
    .col-ng { color: #EC7063; }

    .result-btn-area {
      display: flex; flex-direction: column; gap: 10px;
      width: 100%; max-width: 320px;
    }
    .btn-retry-wrong {
      padding: 16px; border-radius: 16px;
      background: #E74C3C; color: #fff; border: none;
      font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .btn-retry-wrong:active { background: #C0392B; }
    .btn-retry-wrong:disabled { background: #444; color: rgba(255,255,255,0.35); cursor: default; }
    .btn-back-home {
      padding: 16px; border-radius: 16px;
      background: rgba(255,255,255,0.1); color: #fff; border: none;
      font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .btn-back-home:active { background: rgba(255,255,255,0.18); }
  </style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="home-badge">Health Quiz</div>
  <div class="home-title">ライフステージと健康</div>
  <div class="home-chapter">第10章 フラッシュカード</div>
  <div class="home-divider"></div>
  <div class="home-count-wrap">
    <div class="home-stat">
      <div class="home-stat-num" id="home-total">19</div>
      <div class="home-stat-lbl">全問数</div>
    </div>
  </div>
  <button class="btn-start" id="btn-start">スタート</button>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-topbar">
    <div class="topbar-progress" id="topbar-progress">1 / 19</div>
    <button class="topbar-close" id="btn-close">✕</button>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="score-row">
    <div class="score-chip chip-ok">
      <div class="chip-dot"></div>
      <span id="cnt-ok">0</span> 正解
    </div>
    <div class="score-chip chip-ng">
      <div class="chip-dot"></div>
      <span id="cnt-ng">0</span> 不正解
    </div>
  </div>
  <div class="card-area">
    <div class="quiz-card">
      <div class="card-q" id="card-q">―</div>
      <div class="card-sep"></div>
      <div class="card-a-wrap">
        <div class="card-a" id="card-a">―</div>
        <div class="answer-cover state-hidden" id="answer-cover">
          <span class="cover-label" id="cover-label">タップして確認</span>
        </div>
      </div>
    </div>
  </div>
  <div class="quiz-footer">
    <button class="btn-next" id="btn-next">次へ</button>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-heading">結果</div>
  <div class="result-panel">
    <div class="result-pct" id="result-pct">0%</div>
    <div class="result-pct-lbl">正答率</div>
    <div class="result-nums">
      <div class="result-num-item">
        <div class="result-num-val col-ok" id="result-ok">0</div>
        <div class="result-num-lbl">正解</div>
      </div>
      <div class="result-num-item">
        <div class="result-num-val col-ng" id="result-ng">0</div>
        <div class="result-num-lbl">不正解</div>
      </div>
    </div>
  </div>
  <div class="result-btn-area">
    <button class="btn-retry-wrong" id="btn-retry-wrong">間違えた問題を復習</button>
    <button class="btn-back-home" id="btn-back-home">ホームへ戻る</button>
  </div>
</div>

<script>
'use strict';

const DATA = [
  // ─── 問1-1 ───
  {
    q: "心や体はある年齢以降、発育・発達が止まり（　）が始まる。",
    a: "老化"
  },
  {
    q: "就学・就職・結婚・出産・育児・退職などの人生上の出来事を（　）という。",
    a: "ライフイベント"
  },
  {
    q: "ライフイベントには（　）があり、起こる時期は人それぞれ異なる。",
    a: "個人差"
  },
  // ─── 問1-2 ───
  {
    q: "人の一生を乳幼児期・学童期・思春期・青年期・中年期・高年期などに分けたものを（　）という。",
    a: "ライフステージ"
  },
  {
    q: "乳幼児期・学童期の子どもの健康・福祉に関する法律の一つ（　）。",
    a: "母子保健法"
  },
  {
    q: "学童期の子どもの健康に関する法律の一つ（　）。",
    a: "学校保健安全法"
  },
  {
    q: "法律をもとに子どもの健康のために行われる活動を（　）という。",
    a: "保健活動"
  },
  {
    q: "保健活動の担い手となる専門職（　）。",
    a: "保健師"
  },
  // ─── 問1-3 ───
  {
    q: "高齢者の医療の確保に関する法律・介護保険法により提供されるもの。",
    a: "医療・介護"
  },
  // ─── 問2-1 性にかかわる課題 ───
  {
    q: "【性にかかわる課題 ①】\n学童期・思春期から青年期まで続く課題",
    a: "性成熟"
  },
  {
    q: "【性にかかわる課題 ②】\n学童期・思春期から青年期まで続く課題",
    a: "妊娠"
  },
  {
    q: "【性にかかわる課題 ③】\n学童期・思春期から青年期まで続く課題",
    a: "性感染症"
  },
  {
    q: "【性にかかわる課題 ④】\n学童期・思春期から青年期まで続く課題",
    a: "避妊"
  },
  // ─── 問2-2 働く世代 ───
  {
    q: "【働く世代の健康課題 ①】\n働くことにかかわりで生じる健康課題",
    a: "過重労働・ストレス"
  },
  {
    q: "【働く世代の健康課題 ②】\n働くことにかかわりで生じる健康課題",
    a: "生活習慣病"
  },
  // ─── 問2-3 高年期 ───
  {
    q: "【高年期の健康課題 ①】",
    a: "白内障"
  },
  {
    q: "【高年期の健康課題 ②】",
    a: "青光眼（緑内障）"
  },
  {
    q: "【高年期の健康課題 ③】",
    a: "骨粗鬆症"
  },
  {
    q: "【高年期の健康課題 ④】",
    a: "交通事故・認知症"
  }
];

// ── state ──
let queue = [];
let idx = 0;
let state = 'hidden'; // hidden | wrong | correct
let wrongSet = new Set();

// ── DOM ──
const screens = {
  home:   document.getElementById('screen-home'),
  quiz:   document.getElementById('screen-quiz'),
  result: document.getElementById('screen-result')
};
const elQ       = document.getElementById('card-q');
const elA       = document.getElementById('card-a');
const elCover   = document.getElementById('answer-cover');
const elLabel   = document.getElementById('cover-label');
const elProg    = document.getElementById('topbar-progress');
const elFill    = document.getElementById('progress-fill');
const elCntOk   = document.getElementById('cnt-ok');
const elCntNg   = document.getElementById('cnt-ng');

function show(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

function startQuiz(q) {
  queue = q;
  idx = 0;
  wrongSet = new Set();
  show('quiz');
  renderCard();
}

function renderCard() {
  const item = queue[idx];
  const total = queue.length;

  state = 'hidden';
  elQ.textContent = item.q;
  elA.textContent = item.a;
  elCover.className = 'answer-cover state-hidden';
  elLabel.textContent = 'タップして確認';

  elProg.textContent = `${idx + 1} / ${total}`;
  elFill.style.width = `${(idx / total) * 100}%`;

  updateCounts();
}

function updateCounts() {
  const answered = idx;
  const ng = [...wrongSet].filter(i => i < answered).length;
  const ok = answered - ng;
  elCntOk.textContent = ok;
  elCntNg.textContent = ng;
}

elCover.addEventListener('click', () => {
  if (state === 'hidden') {
    state = 'wrong';
    elCover.className = 'answer-cover state-wrong';
    elLabel.textContent = '正解なら再タップ →';
    wrongSet.add(idx);
    updateCounts();
  } else if (state === 'wrong') {
    state = 'correct';
    elCover.className = 'answer-cover state-correct';
    elLabel.textContent = '';
    wrongSet.delete(idx);
    updateCounts();
  } else {
    state = 'wrong';
    elCover.className = 'answer-cover state-wrong';
    elLabel.textContent = '正解なら再タップ →';
    wrongSet.add(idx);
    updateCounts();
  }
});

document.getElementById('btn-next').addEventListener('click', () => {
  if (state === 'hidden') wrongSet.add(idx);
  idx++;
  if (idx >= queue.length) {
    showResult();
  } else {
    renderCard();
  }
});

function showResult() {
  const total = queue.length;
  const ng = wrongSet.size;
  const ok = total - ng;
  const pct = total > 0 ? Math.round((ok / total) * 100) : 0;

  document.getElementById('result-pct').textContent = `${pct}%`;
  document.getElementById('result-ok').textContent = ok;
  document.getElementById('result-ng').textContent = ng;

  const retryBtn = document.getElementById('btn-retry-wrong');
  if (ng > 0) {
    retryBtn.disabled = false;
    retryBtn.textContent = `間違えた ${ng} 問を復習`;
  } else {
    retryBtn.disabled = true;
    retryBtn.textContent = '全問正解！🎉';
  }
  show('result');
}

document.getElementById('btn-start').addEventListener('click', () => {
  startQuiz([...DATA]);
});

document.getElementById('btn-retry-wrong').addEventListener('click', () => {
  const wrongItems = [...wrongSet].sort((a,b) => a-b).map(i => queue[i]);
  if (wrongItems.length > 0) startQuiz(wrongItems);
});

document.getElementById('btn-back-home').addEventListener('click', () => show('home'));
document.getElementById('btn-close').addEventListener('click', () => show('home'));

document.getElementById('home-total').textContent = DATA.length;

if ('serviceWorker' in navigator)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
