<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英単語">
  <title>英単語学習</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #2563eb;
      --primary-d: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif; color: var(--text); overscroll-behavior: none; }

    #app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

    /* ── HEADER ── */
    .header { background: var(--primary); padding: calc(var(--safe-top) + 14px) 20px 0; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .header-title { color: white; font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
    .mode-tabs { display: flex; gap: 4px; }
    .mode-tab { flex: 1; padding: 10px 14px; background: rgba(255,255,255,.15); border: none; border-radius: 10px 10px 0 0; color: rgba(255,255,255,.7); font-size: 14px; font-weight: 700; cursor: pointer; transition: .2s; }
    .mode-tab.active { background: var(--bg); color: var(--primary); }

    /* ── DIRECTION BAR ── */
    .dir-bar { display: flex; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .dir-btn { flex: 1; padding: 8px 10px; background: transparent; border: 2px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; transition: .2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .dir-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* ── PROGRESS ── */
    .prog-wrap { background: var(--surface); padding: 10px 20px 6px; border-bottom: 1px solid var(--border); }
    .prog-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #38bdf8); border-radius: 3px; transition: width .4s ease; width: 0%; }
    .prog-text { text-align: center; font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── SECTIONS ── */
    .section { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* ── CARD (flashcard) ── */
    .card-area { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1200px; min-height: 220px; }
    .card { width: 100%; max-width: 400px; height: 230px; cursor: pointer; position: relative; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; inset: 0; background: var(--surface); border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,.1); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px 16px; }
    .card-back { transform: rotateY(180deg); }

    .lv-badge { position: absolute; top: 12px; left: 14px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 20px; color: white; letter-spacing: .2px; }
    .lv-3   { background: #16a34a; }
    .lv-pre2{ background: #2563eb; }
    .lv-2   { background: #7c3aed; }
    .lv-pre1{ background: #dc2626; }

    .card-word { font-size: 38px; font-weight: 900; text-align: center; line-height: 1.15; color: var(--text); word-break: break-word; }
    .card-trans { font-size: 30px; font-weight: 800; text-align: center; color: var(--primary); word-break: break-word; line-height: 1.2; }
    .card-hint { font-size: 12px; color: var(--muted); margin-top: 12px; }

    .spk-btn { position: absolute; bottom: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(37,99,235,.1); color: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .2s; }
    .spk-btn:hover { background: rgba(37,99,235,.2); transform: scale(1.1); }
    .spk-btn svg { width: 18px; height: 18px; }
    .spk-btn.playing { background: var(--primary); color: white; animation: pulse .7s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.12); } }

    /* ── FLASHCARD ACTIONS ── */
    .fc-actions { display: flex; gap: 10px; }
    .act-btn { flex: 1; padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .18s; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .act-btn:active { transform: scale(.96); }
    .btn-no  { background: #fee2e2; color: var(--danger); }
    .btn-no:hover  { background: var(--danger);  color: white; }
    .btn-yes { background: #dcfce7; color: var(--success); }
    .btn-yes:hover { background: var(--success); color: white; }
    .act-icon { font-size: 18px; }

    .fc-stats { display: flex; justify-content: center; gap: 24px; font-size: 13px; font-weight: 700; }
    .stat-yes { color: var(--success); }
    .stat-no  { color: var(--danger); }

    /* card swipe animation */
    @keyframes swipeR { to { transform: translateX(130%) rotate(18deg); opacity: 0; } }
    @keyframes swipeL { to { transform: translateX(-130%) rotate(-18deg); opacity: 0; } }
    .swipe-r { animation: swipeR .28s forwards; }
    .swipe-l { animation: swipeL .28s forwards; }

    /* ── WRITING MODE ── */
    .wr-card { background: var(--surface); border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,.1); padding: 28px 20px 20px; text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 160px; justify-content: center; }
    .wr-question { font-size: 34px; font-weight: 900; color: var(--text); line-height: 1.2; word-break: break-word; }
    .spk-inline { position: static; margin-top: 4px; }
    .dots { display: flex; gap: 8px; margin-top: 4px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--border); transition: .3s; }
    .dot.on { background: var(--success); transform: scale(1.2); }

    .wr-input-row { display: flex; gap: 8px; }
    .wr-input { flex: 1; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 18px; font-family: inherit; outline: none; transition: border-color .2s; background: var(--surface); }
    .wr-input:focus { border-color: var(--primary); }
    .wr-input.ok  { border-color: var(--success); background: #f0fdf4; }
    .wr-input.ng  { border-color: var(--danger);  background: #fef2f2; }

    .check-btn { padding: 14px 18px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .18s; white-space: nowrap; }
    .check-btn:hover { background: var(--primary-d); }
    .check-btn:active { transform: scale(.96); }

    .wr-result { background: var(--surface); border-radius: var(--radius); padding: 18px 20px; box-shadow: 0 4px 24px rgba(0,0,0,.1); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .res-text { font-size: 20px; font-weight: 800; }
    .res-text.ok { color: var(--success); }
    .res-text.ng { color: var(--danger); }
    .res-ans { font-size: 15px; color: var(--muted); text-align: center; }
    .res-spk { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .next-btn { padding: 12px 28px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .18s; margin-top: 4px; }
    .next-btn:hover { background: var(--primary-d); }

    /* ── COMPLETE SCREENS ── */
    .done-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .done-card { background: var(--surface); border-radius: var(--radius); box-shadow: 0 8px 40px rgba(0,0,0,.12); padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 380px; }
    .done-icon { font-size: 64px; }
    .done-title { font-size: 24px; font-weight: 900; }
    .done-stats { font-size: 15px; color: var(--muted); line-height: 1.7; }
    .pri-btn { padding: 14px 0; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: .18s; width: 100%; max-width: 280px; }
    .pri-btn:hover { background: var(--primary-d); }
    .sec-btn { padding: 12px 0; background: transparent; color: var(--muted); border: 2px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .18s; width: 100%; max-width: 280px; }
    .sec-btn:hover { border-color: var(--muted); color: var(--text); }

    @media (max-width: 360px) {
      .card-word { font-size: 30px; }
      .card-trans { font-size: 26px; }
      .wr-question { font-size: 28px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="header-title">英単語学習</div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="flashcard">暗記カード</button>
      <button class="mode-tab"        data-mode="writing">筆記</button>
    </div>
  </div>

  <!-- DIRECTION -->
  <div class="dir-bar">
    <button class="dir-btn active" data-dir="en-jp">🇺🇸 英語 → 日本語</button>
    <button class="dir-btn"        data-dir="jp-en">🇯🇵 日本語 → 英語</button>
  </div>

  <!-- PROGRESS -->
  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-text" id="progText">0 / 0</div>
  </div>

  <!-- ═══ FLASHCARD SECTION ═══ -->
  <div class="section" id="secFlashcard">
    <div class="card-area">
      <div class="card" id="fcCard">
        <div class="card-inner" id="fcInner">

          <!-- FRONT -->
          <div class="card-face">
            <span class="lv-badge" id="fcBadgeFront"></span>
            <div class="card-word" id="fcFrontWord"></div>
            <div class="card-hint">タップして答えを見る</div>
            <button class="spk-btn" id="fcSpkFront" aria-label="発音">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>

          <!-- BACK -->
          <div class="card-face card-back">
            <span class="lv-badge" id="fcBadgeBack"></span>
            <div class="card-trans" id="fcBackWord"></div>
            <button class="spk-btn" id="fcSpkBack" aria-label="発音">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>

        </div>
      </div>
    </div>

    <div class="fc-actions" id="fcActions" style="visibility:hidden">
      <button class="act-btn btn-no"  id="fcNo" ><span class="act-icon">✗</span>知らない</button>
      <button class="act-btn btn-yes" id="fcYes"><span class="act-icon">✓</span>知ってる</button>
    </div>

    <div class="fc-stats">
      <span class="stat-yes" id="fcStatYes">✓ 0</span>
      <span class="stat-no"  id="fcStatNo" >✗ 0</span>
    </div>
  </div>

  <!-- ═══ WRITING SECTION ═══ -->
  <div class="section" id="secWriting" style="display:none">
    <div class="wr-card">
      <span class="lv-badge" id="wrBadge"></span>
      <div class="wr-question" id="wrQ"></div>
      <button class="spk-btn spk-inline" id="wrSpk" aria-label="発音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </button>
      <div class="dots">
        <span class="dot" id="dot0"></span>
        <span class="dot" id="dot1"></span>
      </div>
    </div>

    <div class="wr-input-row">
      <input type="text" id="wrInput" class="wr-input" placeholder="答えを入力..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="check-btn" id="wrCheck">確認</button>
    </div>

    <div class="wr-result" id="wrResult" style="display:none">
      <div class="res-text" id="wrResText"></div>
      <div class="res-ans"  id="wrResAns"></div>
      <div class="res-spk"  id="wrResSpkWrap" style="display:none">
        <button class="spk-btn" id="wrResSpk" aria-label="発音" style="position:static">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <span style="font-size:13px;color:var(--muted)">発音を聞く</span>
      </div>
      <button class="next-btn" id="wrNext">次へ →</button>
    </div>
  </div>

  <!-- ═══ ROUND COMPLETE ═══ -->
  <div class="done-wrap" id="secRound" style="display:none">
    <div class="done-card">
      <div class="done-icon">🎯</div>
      <div class="done-title">ラウンド完了!</div>
      <div class="done-stats" id="roundStats"></div>
      <button class="pri-btn" id="roundContinue">次のラウンドへ</button>
      <button class="sec-btn" id="roundReset">最初からやり直す</button>
    </div>
  </div>

  <!-- ═══ ALL COMPLETE ═══ -->
  <div class="done-wrap" id="secDone" style="display:none">
    <div class="done-card">
      <div class="done-icon">🏆</div>
      <div class="done-title">全単語マスター!</div>
      <div class="done-stats">素晴らしい！全ての単語を覚えました。</div>
      <button class="pri-btn" id="doneRestart">もう一度チャレンジ</button>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
