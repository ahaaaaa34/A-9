<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座標キャリブレーション</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; font-family: monospace; }

    #info {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(0,0,0,0.85); color: #0f0;
      padding: 8px 12px; font-size: 13px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    #info span { color: #fff; }
    #clear-btn {
      background: #E74C3C; color: #fff; border: none;
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    #output {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(0,0,0,0.9); color: #0f0;
      padding: 8px 12px; font-size: 11px; max-height: 35vh;
      overflow-y: auto; white-space: pre-wrap;
    }

    .wrap {
      position: relative;
      margin-top: 36px;
      margin-bottom: 40vh;
    }
    #img { width: 100%; display: block; }

    .dot {
      position: absolute;
      width: 10px; height: 10px;
      background: red; border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .dot:nth-child(even) { background: cyan; }

    .drawn-box {
      position: absolute;
      border: 2px solid yellow;
      background: rgba(255,255,0,0.25);
      pointer-events: none;
    }
    .drawn-box span {
      position: absolute;
      top: 1px; left: 2px;
      font-size: 9px; color: yellow; white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="info">
  モード:
  <select id="mode">
    <option value="click">クリックで座標取得</option>
    <option value="drag">ドラッグでボックス描画</option>
  </select>
  <span id="cur-pos">x: - y: -</span>
  <button id="clear-btn">クリア</button>
  <span style="color:#aaa; font-size:11px;">ボックスはダブルタップでも描ける</span>
</div>

<div class="wrap" id="wrap">
  <img src="quiz_rot.jpg" id="img" draggable="false">
</div>

<div id="output"># ここに結果が出ます。コピーしてください。</div>

<script>
const img   = document.getElementById('img');
const wrap  = document.getElementById('wrap');
const out   = document.getElementById('output');
const mSel  = document.getElementById('mode');
const curP  = document.getElementById('cur-pos');

let points = [];
let boxes  = [];

// ── pct計算 ──
function pct(ev) {
  const r = img.getBoundingClientRect();
  const x = ((ev.clientX - r.left) / r.width  * 100).toFixed(1);
  const y = ((ev.clientY - r.top)  / r.height * 100).toFixed(1);
  return { x: parseFloat(x), y: parseFloat(y) };
}

// ── mousemove ──
img.addEventListener('mousemove', ev => {
  const p = pct(ev);
  curP.textContent = `x: ${p.x}%  y: ${p.y}%`;
});

// ── touch move (スマホ) ──
img.addEventListener('touchmove', ev => {
  ev.preventDefault();
  const t = ev.touches[0];
  const r = img.getBoundingClientRect();
  const x = ((t.clientX - r.left) / r.width  * 100).toFixed(1);
  const y = ((t.clientY - r.top)  / r.height * 100).toFixed(1);
  curP.textContent = `x: ${x}%  y: ${y}%`;
}, { passive: false });

// ── click mode ──
img.addEventListener('click', ev => {
  if (mSel.value !== 'click') return;
  const p = pct(ev);
  points.push(p);
  addDot(p.x, p.y);
  renderOutput();
});

// ── drag mode ──
let dragStart = null;
let dragging  = false;
let dragEl    = null;

img.addEventListener('mousedown', ev => {
  if (mSel.value !== 'drag') return;
  dragStart = pct(ev);
  dragging  = true;
  dragEl = document.createElement('div');
  dragEl.className = 'drawn-box';
  wrap.appendChild(dragEl);
  updateDragEl(dragStart, dragStart);
});

document.addEventListener('mousemove', ev => {
  if (!dragging || !dragEl) return;
  updateDragEl(dragStart, pct(ev));
});

document.addEventListener('mouseup', ev => {
  if (!dragging) return;
  dragging = false;
  const end = pct(ev);
  const b = boxFrom(dragStart, end);
  dragEl.querySelector('span')?.remove();
  const lbl = document.createElement('span');
  lbl.textContent = label(b);
  dragEl.appendChild(lbl);
  boxes.push({ el: dragEl, b });
  dragEl = null;
  renderOutput();
});

// touch drag
img.addEventListener('touchstart', ev => {
  if (mSel.value !== 'drag') return;
  const t = ev.touches[0];
  dragStart = pct({ clientX: t.clientX, clientY: t.clientY });
  dragging = true;
  dragEl = document.createElement('div');
  dragEl.className = 'drawn-box';
  wrap.appendChild(dragEl);
  updateDragEl(dragStart, dragStart);
}, { passive: true });

document.addEventListener('touchmove', ev => {
  if (!dragging || !dragEl) return;
  const t = ev.touches[0];
  updateDragEl(dragStart, pct({ clientX: t.clientX, clientY: t.clientY }));
}, { passive: true });

document.addEventListener('touchend', ev => {
  if (!dragging) return;
  dragging = false;
  const t = ev.changedTouches[0];
  const end = pct({ clientX: t.clientX, clientY: t.clientY });
  const b = boxFrom(dragStart, end);
  const lbl = document.createElement('span');
  lbl.textContent = label(b);
  dragEl.appendChild(lbl);
  boxes.push({ el: dragEl, b });
  dragEl = null;
  renderOutput();
});

function updateDragEl(a, b) {
  const box = boxFrom(a, b);
  dragEl.style.left   = box.l + '%';
  dragEl.style.top    = box.t + '%';
  dragEl.style.width  = box.w + '%';
  dragEl.style.height = box.h + '%';
}

function boxFrom(a, b) {
  const l = Math.min(a.x, b.x).toFixed(1);
  const t = Math.min(a.y, b.y).toFixed(1);
  const w = Math.abs(b.x - a.x).toFixed(1);
  const h = Math.abs(b.y - a.y).toFixed(1);
  return { l: parseFloat(l), t: parseFloat(t), w: parseFloat(w), h: parseFloat(h) };
}

function label(b) {
  return `l:${b.l} t:${b.t} w:${b.w} h:${b.h}`;
}

function addDot(x, y) {
  const d = document.createElement('div');
  d.className = 'dot';
  d.style.left = x + '%';
  d.style.top  = y + '%';
  wrap.appendChild(d);
}

function renderOutput() {
  let txt = '// クリックした点:\n';
  points.forEach((p, i) => {
    txt += `// [${i}] x:${p.x}% y:${p.y}%\n`;
  });
  if (boxes.length > 0) {
    txt += '\n// ドラッグで描いたボックス:\n';
    boxes.forEach((b, i) => {
      txt += `{ id:${i}, label:"", l:${b.b.l}, t:${b.b.t}, w:${b.b.w}, h:${b.b.h} },\n`;
    });
  }
  out.textContent = txt;
}

document.getElementById('clear-btn').addEventListener('click', () => {
  wrap.querySelectorAll('.dot, .drawn-box').forEach(e => e.remove());
  points = []; boxes = [];
  out.textContent = '# クリア済み';
});
</script>
</body>
</html>
